ne" stroke="#e7d6a6" stroke-width="5"/><text y="30" fill="#e7d6a6" font-family="Arial,sans-serif" font-size="8" letter-spacing="2">NETPATH</text></g><path d="M120 662h300M780 662h300" stroke="#b09254"/><text x="270" y="643" font-family="Georgia,serif" font-size="19">Sample date</text><text x="270" y="689" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">DATE OF ACHIEVEMENT</text><text x="930" y="643" font-family="Georgia,serif" font-size="19">NetPath Learning</text><text x="930" y="689" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">ISSUING LEARNING SYSTEM</text><text x="600" y="742" font-family="Arial,sans-serif" font-size="11" fill="#52616b">SAMPLE ONLY - NO CREDENTIAL ISSUED</text><text x="600" y="769" font-family="Arial,sans-serif" font-size="11" fill="#52616b">Independent, unproctored learning achievement. Not Cisco certification or an accredited qualification.</text></g><text x="600" y="593" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" letter-spacing="4" fill="#996f28">PREVIEW - NOT EARNED</text></svg>